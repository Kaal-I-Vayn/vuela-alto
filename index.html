<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vuela Alto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --paper:#F5F0E8;--card:#FFFDF8;--ink:#1A1A1A;--ink2:#4A4540;--mist:#7D766C;--line:#E2DACD;
  --fire:#F26B1D;--fire-strong:#B9480C;--amber:#F5A623;--ok:#2F7D55;--bad:#B83A31;--warn:#B07A00;
  --sky1:#FBF6EC;--sky2:#F8D9A8;--sea:#2B2A28;
  --shadow:0 1px 0 rgba(26,26,26,.04),0 10px 24px -16px rgba(26,26,26,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131210;--card:#1D1B18;--ink:#F2ECE2;--ink2:#CFC7BA;--mist:#9A9286;--line:#34302B;
  --fire:#FF7A2E;--fire-strong:#C4500F;--amber:#FFB43D;--ok:#5BC08A;--bad:#F07167;--warn:#E8B341;
  --sky1:#24201B;--sky2:#5A3418;--sea:#0B0B0A;--shadow:0 10px 24px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#131210;--card:#1D1B18;--ink:#F2ECE2;--ink2:#CFC7BA;--mist:#9A9286;--line:#34302B;
  --fire:#FF7A2E;--fire-strong:#C4500F;--amber:#FFB43D;--ok:#5BC08A;--bad:#F07167;--warn:#E8B341;
  --sky1:#24201B;--sky2:#5A3418;--sea:#0B0B0A;--shadow:0 10px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.45;
  background-image:
    radial-gradient(circle at 96% 4%,color-mix(in srgb,var(--ink) 7%,transparent) 0 60px,transparent 61px),
    radial-gradient(circle at 92% 12%,color-mix(in srgb,var(--ink) 6%,transparent) 0 6px,transparent 7px),
    radial-gradient(circle at 3% 96%,color-mix(in srgb,var(--fire) 8%,transparent) 0 90px,transparent 91px),
    radial-gradient(circle at 9% 88%,color-mix(in srgb,var(--ink) 6%,transparent) 0 8px,transparent 9px);
  background-attachment:fixed;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin:0 8px 24px;font-weight:700;letter-spacing:.02em}
.kanji{font-family:"Yuji Syuku",serif;color:var(--fire);font-size:2rem;line-height:1}
#nav{display:grid;gap:2px}
#nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--ink2);font-weight:500;white-space:nowrap}
#nav button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
#nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
#nav button:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
main{padding:24px 32px 120px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{margin:0;font-size:1.7rem;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--mist)}
.top-actions{display:flex;gap:8px;align-items:center}
.view{display:grid;gap:16px}
.view[hidden]{display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:1.02rem;display:inline-block;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--fire) 28%,transparent) 62%,color-mix(in srgb,var(--fire) 28%,transparent) 92%,transparent 92%)}
.eyebrow{margin:0;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mist);font-weight:600}
.big{margin:4px 0;font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num{font-size:1.45rem;font-weight:700;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.muted{color:var(--mist);margin:0;font-size:.9rem}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--mist)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.in{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.out{background:var(--fire-strong);border-color:var(--fire-strong);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input[type="color"]{padding:2px;width:42px;height:36px}
input[type="range"]{accent-color:var(--fire);padding:0}
label{display:grid;gap:5px;font-size:.85rem;color:var(--ink2);font-weight:500}
label.check{display:flex;align-items:center;gap:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.warn>i{background:var(--amber)}.bar.over>i{background:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.badge-late{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.empty{color:var(--mist);font-size:.9rem;padding:8px 0;margin:0}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);padding:26px 24px 64px;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky1) 45%,var(--sky2) 100%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42px;background:linear-gradient(180deg,var(--sea),color-mix(in srgb,var(--sea) 80%,var(--fire)))}
.hero::before{content:"";position:absolute;left:50%;bottom:30px;width:120px;height:60px;transform:translateX(-50%);border-radius:120px 120px 0 0;background:radial-gradient(circle at 50% 100%,var(--amber),transparent 70%);opacity:.7}
.hero-in{position:relative;z-index:1;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero-kanji{position:absolute;right:18px;top:6px;font-family:"Yuji Syuku",serif;font-size:clamp(4rem,12vw,8rem);line-height:1;color:var(--ink);opacity:.09;writing-mode:vertical-rl;pointer-events:none}
.birds{position:absolute;right:16%;top:18px;width:200px;color:var(--ink);opacity:.55;pointer-events:none}
.avatar{width:76px;height:76px;border-radius:50%;flex:none;overflow:hidden;border:3px solid var(--card);background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:1.8rem;font-weight:700;box-shadow:var(--shadow);cursor:pointer;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}
blockquote{margin:6px 0 12px;font-family:"Yuji Syuku",serif;font-size:1.25rem;line-height:1.5}
/* lists */
.list{display:grid}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.date{font-size:.78rem;color:var(--mist);font-variant-numeric:tabular-nums;width:72px}
.acts{display:flex;gap:4px;justify-content:flex-end}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}
/* budget */
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) 130px minmax(0,2fr);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow input{width:100%}
/* metas */
.meta-track{position:relative;height:12px;background:var(--line);border-radius:99px;margin:26px 0 10px}
.meta-track>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amber),var(--fire))}
.meta-track .feather{position:absolute;top:-26px;width:26px;color:var(--ink);transform:translateX(-50%)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);font-size:.85rem;font-weight:600}
.badge.on{border-color:var(--fire);background:color-mix(in srgb,var(--fire) 10%,transparent)}
.badge.off{color:var(--mist);border-style:dashed}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--fire)}
.timeline li{position:relative;padding:0 0 12px 10px}
.timeline li::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--fire)}
.chart{position:relative;height:280px}
.chart.wide{height:300px}
.fab{position:fixed;right:24px;bottom:24px;display:flex;gap:8px;z-index:20}
.fab .btn{padding:12px 18px;border-radius:99px;box-shadow:0 10px 24px -10px rgba(0,0,0,.45)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(480px,calc(100vw - 32px));box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,18,16,.5)}
dialog form{padding:20px;display:grid;gap:12px}
dialog h3{margin:0;font-size:1.15rem}
details summary{cursor:pointer;color:var(--ink2);font-size:.85rem;font-weight:600;margin-bottom:10px}
details[open]{display:grid;gap:12px}
.err{color:var(--bad);margin:0;min-height:1em;font-size:.85rem}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;max-width:min(520px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:.25s;z-index:200;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%)}
.feather-fall{position:fixed;top:-40px;width:24px;color:var(--fire);pointer-events:none;z-index:150;animation:fall 3s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.split{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0}
.split dt{color:var(--ink2)}.split dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{height:auto;z-index:15;background:var(--paper);padding:8px 0;border-right:0;border-bottom:1px solid var(--line)}
  .brand{display:none}
  #nav{display:flex;overflow-x:auto;gap:4px;padding:0 16px;scrollbar-width:none}
  main{padding:16px 16px 120px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}
  .prow{grid-template-columns:minmax(0,1fr) 110px}.prow>div:last-child{grid-column:1/-1}
  .fab{left:16px;right:16px;bottom:16px;justify-content:flex-end}
  .birds{right:4%;width:140px}
}
@media (max-width:420px){.grid4{grid-template-columns:1fr 1fr}.num{font-size:1.15rem}.date{width:58px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="kanji">飛べ</span><span>Vuela Alto</span></div>
    <nav id="nav" aria-label="Secciones"></nav>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="title">Inicio</h1><p class="sub" id="hello"></p></div>
      <div class="top-actions">
        <label class="sr" for="mes">Mes</label><input type="month" id="mes">
        <button id="themeBtn" class="btn ghost" aria-label="Cambiar tema claro u oscuro">◐</button>
      </div>
    </header>
    <section id="v-inicio" class="view"></section>
    <section id="v-movs" class="view" hidden></section>
    <section id="v-deudas" class="view" hidden></section>
    <section id="v-subs" class="view" hidden></section>
    <section id="v-presup" class="view" hidden></section>
    <section id="v-metas" class="view" hidden></section>
    <section id="v-proy" class="view" hidden></section>
    <section id="v-graf" class="view" hidden></section>
    <section id="v-herr" class="view" hidden></section>
    <section id="v-ajustes" class="view" hidden></section>
  </main>
</div>
<div class="fab">
  <button class="btn out" data-act="quick-out">＋ Gasto</button>
  <button class="btn in" data-act="quick-in">＋ Ingreso</button>
</div>
<dialog id="dlg">
  <form id="dlgForm" novalidate>
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody" style="display:grid;gap:12px"></div>
    <p class="err" id="dlgErr" role="alert"></p>
    <div class="row end">
      <button type="button" class="btn ghost" data-act="close">Cerrar</button>
      <button class="btn primary" id="dlgOk">Guardar</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<input type="file" id="fileFoto" accept="image/*" hidden>

<script>
'use strict';
/* ====== Datos base ====== */
const KEY = 'vuelaAlto.v1';
const CLP = new Intl.NumberFormat('es-CL', {style:'currency', currency:'CLP', maximumFractionDigits:0});
const CLPc = new Intl.NumberFormat('es-CL', {notation:'compact', maximumFractionDigits:1});
const METODOS = ['Débito','Efectivo','Crédito','Transferencia'];
const IN_CATS = ['Sueldo','Trabajo extra','Ventas','Otros ingresos'];
// t: 'n' = necesidad, 'd' = deseo (para la regla 50/30/20)
const DEF_CATS = [['Arriendo','#8C5A3C','n'],['Supermercado','#4C8C6A','n'],['Transporte','#3E6E9E','n'],['Servicios básicos','#6C6C9C','n'],['Celular/Internet','#5A8FA8','n'],['Salud','#C2554B','n'],['Comida fuera','#F26B1D','d'],['Envío a la familia','#B07D2B','n'],['Trámites/visa','#7A6A58','n'],['Educación','#2F7F7A','n'],['Ocio','#D98E04','d'],['Ropa','#A0527A','d'],['Suscripciones','#5B4B8A','d'],['Otros','#9A948C','d']];
const FRASES = [
  'Empezaste de cero. Todo lo que tienes ahora, lo construiste tú.',
  'No hace falta ser el más alto para saltar más alto.',
  'Cada peso que guardas hoy es una pluma más en tus alas.',
  'Un mal día no borra todo el camino recorrido.',
  'La red no se mueve: tú sí. Salta otra vez.',
  'Lejos de casa, pero cada vez más cerca de tus metas.',
  'Despacio también se llega, siempre que no te detengas.',
  'Lo que hoy es esfuerzo, mañana es libertad.',
  'Tu historia en Chile la escribes tú, movimiento a movimiento.',
  'No compites con nadie: solo con quien eras ayer.',
  'La resiliencia no es no caer, es volver a despegar.',
  'Pequeños saltos, todos los días. Así se vuela.'
];
const RETOS = [['Semana sin comida fuera',7],['7 días sin gastos hormiga',7],['30 días registrando todo',30],['Reto 52 semanas (marca cada semana)',52]];
const TABS = [['inicio','Inicio'],['movs','Movimientos'],['deudas','Deudas'],['subs','Suscripciones'],['presup','Presupuesto'],['metas','Metas'],['proy','Proyección'],['graf','Gráficas'],['herr','Herramientas'],['ajustes','Ajustes']];
const FEATHER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4c-1 7-6 12-14 13 1-7 6-12 14-13z" fill="currentColor" opacity=".9"/><path d="M20 4C13 6 8 11 5 18l-1 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const BIRDS = '<svg class="birds" viewBox="0 0 200 80" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 40q7-8 14 0q7-8 14 0"/><path d="M60 22q6-7 12 0q6-7 12 0"/><path d="M110 48q5-6 10 0q5-6 10 0"/><path d="M150 18q8-9 16 0q8-9 16 0"/><path d="M92 8q4-5 8 0q4-5 8 0"/></g></svg>';

function blank(){
  return {perfil:{nombre:'',llegada:'',foto:'',pagate:15,moneda2:'USD',tasa:0,saldoInicial:0,tema:''},
    cats:DEF_CATS.map(([n,c,t])=>({n,c,t})),movs:[],deudas:[],subs:[],presup:{},metas:[],frases:[],hitos:[],retos:[]};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){const d = JSON.parse(raw), b = blank(); return {...b, ...d, perfil:{...b.perfil, ...d.perfil}};}
  }catch(e){}
  return blank();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('No pude guardar en este navegador. Exporta un respaldo en Ajustes.'); }
}
let S = load();

/* ====== Utilidades ====== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = n => CLP.format(Math.round(n || 0));
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => iso(new Date());
const nowM = () => today().slice(0,7);
const ym = d => d.slice(0,7);
const fdate = d => d ? d.split('-').reverse().join('/') : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (a, f = x => x) => a.reduce((s,x) => s + f(x), 0);
const parseMonto = v => { const n = parseInt(String(v ?? '').replace(/\D/g,''), 10); return n > 0 ? n : 0; }; // CLP no usa decimales: "15.990" -> 15990
const validDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '') && !isNaN(new Date(d + 'T00:00'));
const opts = (list, sel) => (sel && !list.includes(sel) ? [sel, ...list] : list).map(o => `<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function addMonths(m, k){ const [y,mo] = m.split('-').map(Number); const d = new Date(y, mo-1+k, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function lastMonths(n, end = nowM()){ return Array.from({length:n}, (_,i) => addMonths(end, i-n+1)); }
function monthLabel(m, long){ const [y,mo] = m.split('-'); return new Date(y, mo-1, 1).toLocaleDateString('es-CL', long ? {month:'long', year:'numeric'} : {month:'short', year:'2-digit'}); }
function mesesHasta(fecha, from = new Date()){ const b = new Date(fecha + 'T00:00'); return Math.max(1, (b.getFullYear()-from.getFullYear())*12 + b.getMonth() - from.getMonth()); }
function bar(p, cls = ''){ return `<div class="bar ${cls || (p>100?'over':p>=70?'warn':'')}" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,p)}%"></i></div>`; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 4000); }
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

/* ====== Cálculos ====== */
const monthMovs = m => S.movs.filter(x => ym(x.fecha) === m);
const totIn = m => sum(monthMovs(m).filter(x => x.tipo === 'in'), x => x.monto);
const totOut = m => sum(monthMovs(m).filter(x => x.tipo === 'out'), x => x.monto);
const saldoHasta = m => S.perfil.saldoInicial + sum(S.movs.filter(x => !m || ym(x.fecha) <= m), x => x.tipo === 'in' ? x.monto : -x.monto);
const saldo = () => saldoHasta();
const aportado = meta => sum(meta.aportes, a => a.monto);
const enMetas = () => sum(S.metas, aportado);
const presTotal = m => sum(Object.values(S.presup[m] || {}));
const catColor = n => (S.cats.find(c => c.n === n) || {}).c || '#9A948C';
function gastoCat(m){ const o = {}; monthMovs(m).filter(x => x.tipo === 'out').forEach(x => o[x.cat] = (o[x.cat] || 0) + x.monto); return o; }
function promMeses(){ const ms = lastMonths(3, addMonths(nowM(), -1)).filter(m => monthMovs(m).length); return ms.length ? ms : [nowM()]; }
function prom(){ const ms = promMeses(); return {ing: sum(ms, totIn)/ms.length, gas: sum(ms, totOut)/ms.length, ms}; }
const catProm = cat => { const ms = promMeses(); return sum(ms, m => gastoCat(m)[cat] || 0) / ms.length; };
function cuotaMeta(meta, from){ const r = Math.max(0, meta.objetivo - aportado(meta)); return meta.fecha ? Math.ceil(r / mesesHasta(meta.fecha, from)) : 0; }
const diasChile = () => S.perfil.llegada ? Math.floor((new Date(today()+'T00:00') - new Date(S.perfil.llegada+'T00:00')) / 864e5) : -1;
function racha(){ const set = new Set(S.movs.map(x => x.fecha)); const d = new Date(); if(!set.has(iso(d))) d.setDate(d.getDate()-1); let n = 0; while(set.has(iso(d))){ n++; d.setDate(d.getDate()-1); } return n; }
function mesesDentro(){
  return Object.keys(S.presup).filter(m => m < nowM()).filter(m => {
    const p = Object.entries(S.presup[m]).filter(([,v]) => v > 0), g = gastoCat(m);
    return p.length && p.every(([c,v]) => (g[c] || 0) <= v);
  }).length;
}
function insignias(){
  const p = prom(), s = saldo();
  return [
    ['Primer peso ahorrado', enMetas() > 0 || lastMonths(12).some(m => monthMovs(m).length && totIn(m) > totOut(m))],
    ['Fondo de emergencia: 1 mes', p.gas > 0 && s >= p.gas],
    ['Primera meta cumplida', S.metas.some(m => m.done)],
    ['Deuda saldada', S.deudas.some(d => d.dir === 'debo' && d.pagada)],
    ['3 meses dentro del presupuesto', mesesDentro() >= 3],
    ['Racha de 7 días', racha() >= 7],
    ['Un año en Chile', diasChile() >= 365]
  ];
}

/* ====== Diálogo genérico ====== */
let dlgSubmit = null;
function openForm(title, body, onSubmit, ok = 'Guardar'){
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = body;
  $('#dlgErr').textContent = '';
  $('#dlgOk').textContent = ok;
  $('#dlgOk').hidden = !onSubmit;
  dlgSubmit = onSubmit;
  if(!$('#dlg').open) $('#dlg').showModal();
  $('#dlgBody').querySelector('input:not([type=hidden]),select')?.focus();
}
$('#dlgForm').addEventListener('submit', e => {
  e.preventDefault();
  const fn = dlgSubmit;
  if(!fn) return $('#dlg').close();
  const err = fn(Object.fromEntries(new FormData(e.target)));
  if(err){ $('#dlgErr').textContent = err; return; }
  if(dlgSubmit === fn) $('#dlg').close(); // si fn abrió otro diálogo (ej. Págate primero), no lo cerramos
});

  else toast('Gasto guardado.');

function pagatePrimero(monto){
  const act = S.metas.filter(x => !x.done);
  if(!act.length || !S.perfil.pagate) return toast('Ingreso guardado. ¡Sigue sumando!');
  const sug = Math.round(monto * S.perfil.pagate / 100);
  openForm('Págate primero', `

  fd => { const v = parseMonto(fd.monto); if(!v) return 'Ingresa un monto mayor a 0.'; aportar(S.metas.find(x => x.id === fd.meta), v); }, 'Apartar');
}
function aportar(meta, v){
  meta.aportes.push({monto:v, fecha:today()});

    meta.done = true; meta.doneFecha = today();
    S.hitos.push({id:uid(), fecha:today(), texto:`Cumplí mi meta: ${meta.nombre}`});
    commit(); celebrate(`¡Volaste más alto! Meta "${meta.nombre}" cumplida.`);
  } else { commit(); toast(`${fmt(v)} apartados para "${meta.nombre}".`); }
}

function diaEn(m, dia){ const [y,mo] = m.split('-').map(Number); return m + '-' + String(Math.min(dia, new Date(y, mo, 0).getDate())).padStart(2, '0'); } // día 31 en febrero -> 28/29
function proxPago(s){
  const pagado = s.pagos.includes(nowM()), f = diaEn(pagado ? addMonths(nowM(), 1) : nowM(), s.dia);
  return {f, pagado, dias:Math.round((new Date(f + 'T00:00') - new Date(today() + 'T00:00')) / 864e5)};
}
const estadoPago = p => p.dias < 0 ? [`Atrasada ${-p.dias} día${p.dias === -1 ? '' : 's'}`, 'badge-late'] : p.dias === 0 ? ['Se cobra hoy', 'badge-late'] : [`En ${p.dias} día${p.dias === 1 ? '' : 's'}`, p.dias <= 3 ? 'badge-late' : ''];

      ${S.frases.length ? `<div class="list">${S.frases.map((f, i) => `<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><span>${esc(f)}</span><button class="btn sm ghost danger" data-act="del-frase" data-id="${i}" aria-label="Eliminar frase">✕</button></div>`).join('')}</div>` : '<p class="empty">Agrega frases que te muevan; aparecerán en Inicio.</p>'}</div>
    <div class="card"><h3>Tus datos</h3>
      <p class="muted" style="margin-bottom:12px">Todo se guarda solo en este navegador. Exporta un respaldo seguido (y antes de borrar el historial).</p>
      <div class="row"><button class="btn primary" data-act="export">Exportar respaldo (JSON)</button><button class="btn" data-act="import">Importar respaldo</button><button class="btn" data-act="csv">Exportar CSV</button></div>
      <div class="row" style="margin-top:12px"><button class="btn" data-act="demo">Cargar demo</button><button class="btn" data-act="del-demo">Borrar demo</button><button class="btn danger" data-act="reset">Borrar todo</button></div></div>
  </div>`;
}
const RENDER = {inicio:renderInicio, movs:renderMovs, deudas:renderDeudas, subs:renderSubs, presup:renderPresup, metas:renderMetas, proy:renderProy, graf:renderGraf, herr:renderHerr, ajustes:renderAjustes};
function render(){ renderHello(); RENDER[tab](); }
function commit(){ save(); render(); }
function go(t){
  tab = t;
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'v-' + t);
  document.querySelectorAll('#nav button').forEach(b => b.dataset.tab === t ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('#title').textContent = TABS.find(x => x[0] === t)[1];
  render();
  window.scrollTo({top:0});
}

/* ====== Celebración ====== */
function celebrate(msg){
  toast(msg);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i = 0; i < 18; i++){
    const f = document.createElement('span');
    f.className = 'feather-fall'; f.innerHTML = FEATHER;
    f.style.left = Math.random() * 100 + 'vw';
    f.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    f.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    f.style.animationDelay = Math.random() * .8 + 's';
    if(i % 3 === 0) f.style.color = 'var(--ink)';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 4200);
  }
}

/* ====== Demo ====== */
function demo(){
  let seed = 7; const rnd = (a, b) => { seed = (seed * 9301 + 49297) % 233280; return Math.round(a + (seed / 233280) * (b - a)); };
  const add = (tipo, monto, cat, fecha, desc, rec = false, metodo = 'Débito') => { if(fecha <= today()) S.movs.push({id:uid(), tipo, monto, fecha, cat, desc, metodo, recurrente:rec, demo:true}); };
  lastMonths(6).forEach((m, i) => {
    add('in', 850000, 'Sueldo', m + '-05', 'Sueldo', true, 'Transferencia');
    if(i % 2) add('in', rnd(80000, 160000), 'Trabajo extra', m + '-18', 'Turno extra fin de semana', false, 'Transferencia');
    add('out', 320000, 'Arriendo', m + '-03', 'Arriendo pieza', true, 'Transferencia');
    add('out', 100000, 'Envío a la familia', m + '-06', 'Envío a casa', true, 'Transferencia');
    add('out', 15990, 'Celular/Internet', m + '-08', 'Plan celular', true);
    add('out', rnd(120000, 180000), 'Supermercado', m + '-10', 'Supermercado del mes');
    add('out', rnd(35000, 50000), 'Transporte', m + '-02', 'Carga Bip!');
    add('out', rnd(25000, 70000), 'Comida fuera', m + '-14', 'Completos y salidas', false, 'Efectivo');
    add('out', rnd(15000, 45000), 'Ocio', m + '-20', 'Cine / salida', false, 'Crédito');
    add('out', rnd(18000, 30000), 'Servicios básicos', m + '-12', 'Luz y agua');
  });
  S.metas.push({id:uid(), nombre:'Fondo de emergencia', objetivo:1000000, fecha:addMonths(nowM(), 8) + '-01', aportes:[{monto:250000, fecha:today()}], done:false, demo:true});
  S.metas.push({id:uid(), nombre:'Viaje a casa', objetivo:1200000, fecha:addMonths(nowM(), 12) + '-15', aportes:[{monto:120000, fecha:today()}], done:false, demo:true});
  S.deudas.push({id:uid(), dir:'meDeben', persona:'Compañero de trabajo', monto:50000, fecha:today(), limite:'', notas:'Almuerzos', abonos:[], pagada:false, demo:true});
  S.deudas.push({id:uid(), dir:'debo', persona:'Amigo', monto:80000, fecha:lastMonths(2)[0] + '-10', limite:nowM() + '-28', notas:'Préstamo para el depósito', abonos:[{monto:30000, fecha:today()}], pagada:false, demo:true});
  S.hitos.push({id:uid(), fecha:lastMonths(6)[0] + '-01', texto:'Llegué a Chile', demo:true}, {id:uid(), fecha:lastMonths(6)[0] + '-20', texto:'Primer trabajo', demo:true});
  S.retos.push({id:uid(), nombre:'Semana sin comida fuera', meta:7, checks:[], demo:true});
  const d = new Date().getDate();
  S.subs.push({id:uid(), nombre:'Streaming de series', monto:9990, dia:Math.min(28, d + 2), cat:'Ocio', metodo:'Crédito', pagos:[], demo:true},
    {id:uid(), nombre:'Música', monto:5490, dia:Math.max(1, d - 3), cat:'Ocio', metodo:'Crédito', pagos:[], demo:true},
    {id:uid(), nombre:'Gimnasio', monto:19990, dia:1, cat:'Salud', metodo:'Débito', pagos:[nowM()], demo:true});
  S.presup[nowM()] = {...{Arriendo:320000, Supermercado:160000, Transporte:45000, 'Comida fuera':40000, Ocio:30000, 'Envío a la familia':100000}, ...(S.presup[nowM()] || {})};
}
function delDemo(){
  ['movs', 'metas', 'deudas', 'subs', 'hitos', 'retos'].forEach(k => S[k] = S[k].filter(x => !x.demo));
}

/* ====== Acciones ====== */
const byId = (arr, id) => S[arr].find(x => x.id === id);
const ACT = {
  'close': () => $('#dlg').close(),
  'go': id => go(id),
  'quick-out': () => movForm('out', null, true),
  'quick-in': () => movForm('in', null, true),
  'new-out': () => movForm('out'),
  'new-in': () => movForm('in'),
  'edit-mov': id => movForm(null, byId('movs', id)),
  'del-mov': id => { if(confirm('¿Eliminar este movimiento?')){ S.movs = S.movs.filter(x => x.id !== id); commit(); } },
  'recurrentes': () => {
    const latest = {}, key = x => x.tipo + '|' + x.cat + '|' + x.desc;
    S.movs.filter(x => x.recurrente && ym(x.fecha) < curM).forEach(x => { if(!latest[key(x)] || latest[key(x)].fecha < x.fecha) latest[key(x)] = x; });
    const ya = new Set(monthMovs(curM).map(key)); let n = 0;
    Object.values(latest).forEach(x => { if(ya.has(key(x))) return; S.movs.push({...x, id:uid(), fecha:curM + '-' + String(Math.min(+x.fecha.slice(8), 28)).padStart(2, '0')}); n++; });
    commit(); toast(n ? `${n} movimientos recurrentes creados en ${monthLabel(curM, true)}.` : 'No hay recurrentes pendientes para este mes.');
  },
  'csv': () => {
    const q = s => '"' + String(s).replace(/"/g, '""') + '"';
    const rows = [['fecha','tipo','categoria','descripcion','metodo','monto'], ...[...S.movs].sort((a,b) => a.fecha.localeCompare(b.fecha)).map(x => [x.fecha, x.tipo === 'in' ? 'ingreso' : 'gasto', x.cat, x.desc, x.metodo, x.monto])];
    download(`movimientos-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\n'), 'text/csv');
  },
  'new-deuda': dir => deudaForm(dir),
  'edit-deuda': id => deudaForm(null, byId('deudas', id)),
  'abono': id => abonoForm(byId('deudas', id)),
  'pagada': id => marcarPagada(byId('deudas', id)),
  'del-deuda': id => { if(confirm('¿Eliminar este registro?')){ S.deudas = S.deudas.filter(x => x.id !== id); commit(); } },
  'new-sub': () => subForm(),
  'edit-sub': id => subForm(byId('subs', id)),
  'pagar-sub': id => pagarSub(byId('subs', id)),
  'del-sub': id => { if(confirm('¿Eliminar esta suscripción? Los pagos ya registrados se mantienen en Movimientos.')){ S.subs = S.subs.filter(x => x.id !== id); commit(); } },
  'copy-pres': () => { const p = S.presup[addMonths(curM, -1)]; if(!p) return toast('El mes anterior no tiene presupuesto.'); S.presup[curM] = {...p}; commit(); toast('Presupuesto copiado.'); },
  'new-meta': () => metaForm(),
  'aportar': id => { const x = byId('metas', id); openForm(`Aportar a "${x.nombre}"`, `<p class="muted">Faltan ${fmt(x.objetivo - aportado(x))}.</p><label>Monto<input name="monto" inputmode="numeric" placeholder="Ej: 50.000"></label>`, fd => { const v = parseMonto(fd.monto); if(!v) return 'Ingresa un monto mayor a 0.'; aportar(x, v); }, 'Aportar'); },
  'del-meta': id => { if(confirm('¿Eliminar esta meta y sus aportes?')){ S.metas = S.metas.filter(x => x.id !== id); commit(); } },
  'otra-frase': () => { fraseOff++; renderInicio(); },
  'add-frase': () => openForm('Mi frase', '<label>Frase<input name="t" maxlength="140" placeholder="Algo que te recuerde por qué empezaste"></label>', fd => { if(!fd.t.trim()) return 'Escribe tu frase.'; S.frases.push(fd.t.trim()); commit(); toast('Frase guardada.'); }),
  'del-frase': i => { S.frases.splice(+i, 1); commit(); },
  'add-hito': () => openForm('Nuevo hito', `<label>Fecha<input type="date" name="fecha" value="${today()}"></label><label>¿Qué lograste?<input name="t" maxlength="100" placeholder="Ej: Primer arriendo propio"></label>`, fd => { if(!validDate(fd.fecha)) return 'Fecha no válida.'; if(!fd.t.trim()) return 'Describe tu hito.'; S.hitos.push({id:uid(), fecha:fd.fecha, texto:fd.t.trim()}); commit(); celebrate('¡Un hito más en tu historia!'); }),
  'del-hito': id => { S.hitos = S.hitos.filter(x => x.id !== id); commit(); },
  'new-reto': () => openForm('Nuevo reto', `<label>Reto<select name="r">${RETOS.map(([n,k], i) => `<option value="${i}">${esc(n)} (${k})</option>`).join('')}<option value="c">Personalizado…</option></select></label>
      <label>Nombre (si es personalizado)<input name="n" maxlength="60"></label><label>Días (si es personalizado)<input type="number" name="k" min="1" max="365" value="10"></label>`,
    fd => { const c = fd.r === 'c', nombre = c ? fd.n.trim() : RETOS[+fd.r][0], meta = c ? +fd.k : RETOS[+fd.r][1];
      if(!nombre) return 'Ponle un nombre al reto.'; if(!(meta >= 1)) return 'Indica cuántos días.';
      S.retos.push({id:uid(), nombre, meta, checks:[]}); commit(); toast('Reto activado. ¡Tú puedes!'); }),
  'check-reto': id => { const r = byId('retos', id); if(r.checks.includes(today())) return; r.checks.push(today()); if(r.checks.length >= r.meta){ S.hitos.push({id:uid(), fecha:today(), texto:`Completé el reto: ${r.nombre}`}); commit(); celebrate(`¡Reto "${r.nombre}" completado!`); } else { commit(); toast(`Día ${r.checks.length} de ${r.meta}. ¡Sigue así!`); } },
  'del-reto': id => { S.retos = S.retos.filter(x => x.id !== id); commit(); },
  'cierre': () => openForm('Cierre de mes', `<div>${cierreHTML(curM)}</div><button type="button" class="btn" data-act="print-cierre">Imprimir / guardar PDF</button>`, null),
  'print-cierre': () => { $('#print').innerHTML = cierreHTML(curM); $('#dlg').close(); window.print(); },
  'foto': () => $('#fileFoto').click(),
  'del-foto': () => { S.perfil.foto = ''; commit(); },
  'new-cat': () => openForm('Nueva categoría', `<label>Nombre<input name="n" maxlength="30"></label><div class="grid2"><label>Color<input type="color" name="c" value="#F26B1D"></label><label>Tipo<select name="t"><option value="n">Necesidad</option><option value="d">Deseo</option></select></label></div>`,
    fd => { const n = fd.n.trim(); if(!n) return 'Escribe un nombre.'; if(S.cats.some(c => c.n.toLowerCase() === n.toLowerCase())) return 'Esa categoría ya existe.'; S.cats.push({n, c:fd.c, t:fd.t}); commit(); }),
  'del-cat': i => { const c = S.cats[+i]; if(confirm(`¿Eliminar la categoría "${c.n}"? Los movimientos existentes conservan su nombre.`)){ S.cats.splice(+i, 1); commit(); } },
  'export': () => download(`vuela-alto-respaldo-${today()}.json`, JSON.stringify(S, null, 2), 'application/json'),
  'import': () => $('#fileImport').click(),
  'demo': () => { delDemo(); demo(); commit(); toast('Datos de demo cargados. Puedes borrarlos en Ajustes.'); },
  'del-demo': () => { delDemo(); commit(); toast('Datos de demo borrados.'); },
  'reset': () => { if(confirm('¿Borrar TODOS tus datos? Exporta un respaldo antes. Esto no se puede deshacer.')){ S = blank(); commit(); toast('Todo en blanco. Un nuevo comienzo.'); } }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(b) ACT[b.dataset.act]?.(b.dataset.id, b); });
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'fQ'){ F.q = t.value; renderMovList(); }
  else if(t.closest('#sim')) simular();
  else if(t.id === 'acMonto') antes();
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'fTipo' || t.id === 'fCat'){ F.tipo = $('#fTipo').value; F.cat = $('#fCat').value; renderMovList(); }
  else if(t.dataset.pres !== undefined){ (S.presup[curM] ||= {})[t.dataset.pres] = parseMonto(t.value); commit(); }
  else if(t.dataset.pf){
    const k = t.dataset.pf, p = S.perfil;
    if(k === 'saldoInicial') p.saldoInicial = parseMonto(t.value) * (String(t.value).trim().startsWith('-') ? -1 : 1);
    else if(k === 'pagate') p.pagate = Math.min(80, Math.max(0, Math.round(+t.value || 0)));
    else if(k === 'tasa') p.tasa = Math.max(0, +t.value || 0);
    else if(k === 'llegada'){ if(t.value && !validDate(t.value)) return toast('Fecha no válida.'); p.llegada = t.value; }
    else p[k] = t.value.trim();
    save(); renderHello(); toast('Guardado.');
  }
  else if(t.dataset.catc !== undefined){ S.cats[+t.dataset.catc].c = t.value; save(); }
  else if(t.dataset.catt !== undefined){ S.cats[+t.dataset.catt].t = t.value; save(); }
});
$('#mes').addEventListener('change', e => { if(/^\d{4}-\d{2}$/.test(e.target.value)){ curM = e.target.value; render(); } });
$('#themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.perfil.tema = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = S.perfil.tema; commit();
});
$('#fileImport').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  f.text().then(txt => {
    const d = JSON.parse(txt);
    if(!d || !Array.isArray(d.movs) || !d.perfil) throw new Error('formato');
    if(!confirm('Esto reemplaza tus datos actuales por los del respaldo. ¿Continuar?')) return;
    const b = blank(); S = {...b, ...d, perfil:{...b.perfil, ...d.perfil}}; commit(); toast('Respaldo importado.');
  }).catch(() => toast('Ese archivo no es un respaldo válido de Vuela Alto.'));
});
$('#fileFoto').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  const img = new Image();
  img.onload = () => { // reducimos a 256px para no llenar el almacenamiento del navegador
    const c = document.createElement('canvas'), s = Math.min(img.width, img.height);
    c.width = c.height = 256;
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
    S.perfil.foto = c.toDataURL('image/jpeg', .85); URL.revokeObjectURL(img.src); commit();
  };
  img.onerror = () => toast('No pude leer esa imagen.');
  img.src = URL.createObjectURL(f);
});

/* ====== Inicio ====== */
if(S.perfil.tema) document.documentElement.dataset.theme = S.perfil.tema;
$('#nav').innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}">${n}</button>`).join('');
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(b) go(b.dataset.tab); });
$('#mes').value = curM;
go('inicio');

console.assert(parseMonto('15.990') === 15990 && parseMonto('abc') === 0, 'parseMonto');

console.assert(mesesHasta('2027-09-01', new Date(2026, 10, 17)) === 10, 'mesesHasta');
console.assert(diaEn('2027-02', 31) === '2027-02-28' && diaEn('2026-11', 5) === '2026-11-05', 'diaEn');
console.assert(cuotaMeta({objetivo:1200, aportes:[{monto:200}], fecha:'2027-09-01'}, new Date(2026, 10, 17)) === 100, 'cuotaMeta');
